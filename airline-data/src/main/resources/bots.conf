# =============================================================================
# Configuração de bots customizados
# =============================================================================
# Edite este arquivo para adicionar ou remover bots concorrentes.
# Após editar, rode o AirlineGenerator para regenerar todos os bots.
#
# COMO USAR:
#   - Adicione um bloco { } por bot dentro de custom-bots = [ ... ]
#   - Campos obrigatórios: name, username, hq, bases, toAirports, models, maxDistance, quality
#   - Campos opcionais:    balance (padrão 1.000.000.000), reputation (padrão 80)
#
# AVIÕES COMUNS (nomes exatos do jogo):
#   Curto alcance:  "ATR 72-600", "Embraer E175-E2", "Embraer E195-E2"
#   Médio alcance:  "Boeing 737 MAX 8", "Boeing 737 MAX 10", "Airbus A320neo", "Airbus A321neo"
#   Longo alcance:  "Boeing 787-8 Dreamliner", "Boeing 787-9 Dreamliner", "Airbus A350-900"
#   Muito longo:    "Boeing 777-300ER", "Airbus A350-1000"
#
# FILTRO DE DESTINOS (toAirports) — escolha UMA das opções:
#   Por países:    toAirports = { countries = ["BR", "AR", "CL"] }
#   Por zonas:     toAirports = { zones = ["Hispanic", "Lusophone"] }
#   Por aeroportos explícitos: toAirports = { airports = ["GRU", "GIG", "BOG"] }
#   Todos:         toAirports = { all = true }
#
# QUALIDADE (quality): 40 = low-cost, 60 = normal, 80 = premium, 100 = luxo
# DISTÂNCIA (maxDistance): em km — ex: 3000 = doméstico BR, 10000 = intercontinental
#
# PRICING DINÂMICO (opcionais):
#   pricingAggressiveness: 0.0 = preço estático/premium, 1.0 = guerra total (padrão: 0.5)
#   minPriceRatio: piso como fração do preço padrão, ex: 0.6 = 60% (padrão: 0.6)
#   maxPriceRatio: teto como fração do preço padrão, ex: 1.3 = 130% (padrão: 1.3)
# =============================================================================

custom-bots = [

  # --- Bot 1: Concorrente doméstico brasileiro (low-cost agressivo) ---
  {
    name       = "VoeRapido"
    username   = "bot_voerapido"
    hq         = "GRU"
    bases      = ["CGH", "GIG", "BSB", "SSA", "FOR", "REC", "CWB", "BEL"]
    toAirports = { countries = ["BR"] }
    models     = ["Airbus A320neo", "Airbus A321neo", "Boeing 737 MAX 8"]
    maxDistance = 4500
    quality    = 45
    balance    = 800000000
    pricingAggressiveness = 0.9
    minPriceRatio = 0.6
    maxPriceRatio = 1.1
  }

  # --- Bot 2: Concorrente regional (Embraer, curtas distâncias, agressivo) ---
  {
    name       = "AzuraBrasil"
    username   = "bot_azura_br"
    hq         = "VCP"
    bases      = ["GRU", "CGH", "GIG", "CWB", "POA", "FLN", "CNF", "MCZ"]
    toAirports = { countries = ["BR"] }
    models     = ["Embraer E195-E2", "Embraer E175-E2", "Embraer E190-E2"]
    maxDistance = 3000
    quality    = 60
    pricingAggressiveness = 0.85
    minPriceRatio = 0.65
    maxPriceRatio = 1.15
  }

  # --- Bot 3: Concorrente sul-americano (mainstream moderado) ---
  {
    name       = "SulAmericana"
    username   = "bot_sulam"
    hq         = "GRU"
    bases      = ["GIG", "BSB", "CWB", "POA", "EZE", "SCL", "BOG", "LIM"]
    toAirports = { zones = ["Hispanic", "Lusophone"] }
    models     = ["Boeing 737 MAX 8", "Airbus A321neo", "Boeing 787-8 Dreamliner"]
    maxDistance = 8000
    quality    = 65
    pricingAggressiveness = 0.5
    minPriceRatio = 0.7
    maxPriceRatio = 1.2
  }

  # --- Bot 4: Concorrente intercontinental (premium, pouco agressivo) ---
  {
    name       = "TransAtlantico"
    username   = "bot_transatl"
    hq         = "GIG"
    bases      = ["GRU", "BSB", "FOR", "REC", "SSA"]
    toAirports = { all = true }
    models     = ["Boeing 787-9 Dreamliner", "Boeing 777-300ER", "Airbus A350-900"]
    maxDistance = 12000
    quality    = 75
    reputation = 85
    pricingAggressiveness = 0.3
    minPriceRatio = 0.8
    maxPriceRatio = 1.3
  }

]

